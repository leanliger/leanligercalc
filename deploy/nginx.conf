# ---------------------------------------------------------------------------
# nginx reverse proxy for the Prep Calculator, configured so the Whop iframe
# embed is not broken by the proxy layer.
#
# The app itself already sends the correct policy (see next.config.mjs):
#
#     Content-Security-Policy: frame-ancestors 'self' https://whop.com https://*.whop.com;
#
# nginx's only job here is to not undo that. Two failure modes to avoid:
#   1. nginx injecting its own X-Frame-Options, which browsers honour ahead of
#      frame-ancestors and which cannot express an allow-list.
#   2. nginx adding a SECOND Content-Security-Policy header. Two CSP headers are
#      enforced independently and the browser takes the intersection, so a
#      second policy can only ever narrow the first — never widen it.
# ---------------------------------------------------------------------------

# Required for the websocket upgrade used by `next dev`'s HMR. Harmless in
# production, where `next start` does not open a websocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name prep.example.com;

    # ssl_certificate     /etc/letsencrypt/live/prep.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/prep.example.com/privkey.pem;

    # -----------------------------------------------------------------------
    # !! Do NOT add `add_header X-Frame-Options ...` anywhere in this file. !!
    #
    # It is a common line in hardening baselines and Mozilla's generated
    # templates. Its only values are DENY and SAMEORIGIN — neither of which can
    # express "whop.com may frame this" — and browsers give it precedence over
    # frame-ancestors when both are present. One stray SAMEORIGIN here silently
    # defeats the CSP the app is sending.
    # -----------------------------------------------------------------------

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Strip any X-Frame-Options arriving FROM the upstream app before it
        # reaches the browser. Next.js does not send one, so this is purely
        # defensive — it costs nothing and covers a future middleware or a
        # platform layer that starts emitting it.
        #
        # NOTE: proxy_hide_header only filters headers coming from upstream. It
        # has no effect on headers nginx itself added via add_header. See the
        # "Removing an inherited add_header" note at the bottom of this file.
        proxy_hide_header X-Frame-Options;

        # The upstream Content-Security-Policy passes through untouched. Do not
        # re-add it here (see failure mode 2 above).
    }
}

# ---------------------------------------------------------------------------
# Removing an inherited add_header
#
# If X-Frame-Options is being set by an `add_header` in a parent http{} or
# server{} block — often an included snippet like /etc/nginx/snippets/
# security-headers.conf — the fix is to delete that line. Stock nginx has no
# directive that unsets a header it added itself.
#
# There is a well-known workaround, and it is a trap worth understanding:
# add_header directives are inherited from the parent level ONLY IF the child
# level defines no add_header directives of its own. So putting any single
# add_header inside `location /` drops every inherited one.
#
# That does remove the unwanted X-Frame-Options — along with HSTS,
# X-Content-Type-Options, Referrer-Policy and anything else the parent was
# contributing, silently. If you take this route you must re-declare all of
# them in the location block:
#
#     location / {
#         add_header Strict-Transport-Security "max-age=63072000" always;
#         add_header X-Content-Type-Options    "nosniff"           always;
#         add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
#         # ... and deliberately NOT X-Frame-Options
#         proxy_pass http://127.0.0.1:3000;
#     }
#
# The clean alternative is the headers-more module (nginx-extras on Debian and
# Ubuntu), which can remove a header outright regardless of where it was set:
#
#     more_clear_headers 'X-Frame-Options';
#
# Also note: add_header applies only to a fixed set of status codes (200, 201,
# 204, 206, 301, 302, 303, 304, 307, 308) unless you append `always`. Security
# headers should generally carry `always` so they survive error responses too.
# ---------------------------------------------------------------------------
